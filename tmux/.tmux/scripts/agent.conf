# Shared config for tmux agent scripts
# Agent process name (used to identify agent panes)
AGENT_CMD="claude"
# Sentinel character embedded in the agent's status line (see ~/.claude/statusline.sh)
# If absent from the last few lines of a pane, the agent is awaiting input
SENTINEL="👾"
# How many non-empty lines from the bottom to check for sentinel
SENTINEL_TAIL=5
